<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivum</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <h1>Archivum</h1>
          <p class="tagline">Photo archiving automation</p>
        </div>
      </div>
      <p class="intro">
        Pick a tool below. Use <strong>Preview</strong> to see exactly what
        will happen first, then <strong>Run</strong> to apply it.
      </p>
    </header>

    <section id="tool-list" class="tool-list" aria-live="polite">
      <p class="loading">Looking for tools&hellip;</p>
    </section>

    <section id="results" class="results" hidden>
      <div class="results-head">
        <h2 id="results-title">Results</h2>
        <button id="results-clear" class="btn ghost" type="button">Clear</button>
      </div>
      <p id="results-summary" class="results-summary"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Status</th>
              <th>Source</th>
              <th>Destination</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="picker-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <header class="modal-head">
        <h2 id="picker-title">Choose a folder</h2>
        <button id="picker-close" class="btn ghost" type="button">Close</button>
      </header>

      <div class="picker-actions">
        <button id="picker-home" class="btn ghost" type="button">Home</button>
        <button id="picker-up" class="btn ghost" type="button">Up</button>
        <input id="picker-path" class="picker-path" type="text" placeholder="/path/to/folder" autocomplete="off">
        <button id="picker-go" class="btn" type="button">Go</button>
      </div>

      <nav id="picker-crumbs" class="picker-crumbs" aria-label="Breadcrumb"></nav>
      <p id="picker-status" class="picker-status" hidden></p>
      <ul id="picker-list" class="picker-list"></ul>

      <footer class="modal-foot">
        <button id="picker-select" class="btn primary" type="button">Select this folder</button>
      </footer>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
